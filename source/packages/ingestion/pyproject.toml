[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelcat-ingestion"
version = "0.1.0"
readme = "README.md"
description = "Pinned source acquisition, parsing and evidence references"
requires-python = ">=3.11"
dependencies = ["kernelcat-executor>=0.8,<1"]

[project.scripts]
kc-data = "kernelcat_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernelcat_ingestion = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["kernelcat_ingestion"]
known-third-party = ["kernelcat_executor"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
