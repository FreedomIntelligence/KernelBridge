[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelcat-ingestion"
version = "0.1.0"
readme = "README.md"
description = "Pinned source acquisition, parsing and evidence references"
requires-python = ">=3.11"
dependencies = ["kernelcat-executor>=0.8,<1"]

[project.scripts]
kc-data = "kernelcat_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernelcat_ingestion = ["py.typed"]
