[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelcat-executor"
version = "0.8.0"
description = "Finite kernel execution, admission, receipts and recovery services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "types-jsonschema>=4"]
backend = ["requests>=2.32,<3", "numpy>=1.24,<3", "paramiko>=3.4,<5", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false


[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
