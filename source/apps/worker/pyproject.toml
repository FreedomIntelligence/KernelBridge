[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelcat-worker"
version = "0.8.0"
description = "Finite stdio execution worker and concrete KernelCat capability composition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kernelcat-executor==0.8.0", "kernelcat-knowledge==0.1.0", "kernelcat-ingestion==0.1.0", "pydantic>=2.10,<3", "PyYAML>=6,<7", "jsonschema>=4.20,<5"]

[project.scripts]
kernelcat-worker = "kernelcat_worker.cli:main"
kernelcat-admin = "kernelcat_worker.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernelcat_worker = ["py.typed"]
